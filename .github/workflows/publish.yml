name: Publish

on:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        package: [date, file, git, number, string, types]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to JSR (dry run)
        if: startsWith(github.ref, 'refs/tags/v') == false
        working-directory: packages/${{ matrix.package }}
        run: npx jsr publish --dry-run --allow-dirty

      - name: Publish to JSR
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/${{ matrix.package }}
        run: npx jsr publish
